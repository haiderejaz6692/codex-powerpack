name: Validate package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package metadata and catalog
        run: python scripts/validate_package.py
      - name: Check Bash installer syntax
        run: bash -n scripts/bootstrap.sh
      - name: Test Bash router installation
        env:
          SKIP_CORE: "1"
          CODEX_HOME: ${{ runner.temp }}/codex-powerpack-test
        run: |
          bash scripts/bootstrap.sh
          test -f "$CODEX_HOME/skills/skill-library-router/SKILL.md"

