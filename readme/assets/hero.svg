<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Codex Powerpack</title>
  <desc id="desc">Codex Powerpack bundles skill routing, model comparison, and visual README workflows with a searchable GitHub skill catalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192f"/>
      <stop offset="1" stop-color="#12375a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="64" r="180" fill="#38bdf8" opacity="0.07"/>
  <circle cx="988" cy="388" r="210" fill="#5eead4" opacity="0.05"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="105" fill="#5eead4" font-size="24" font-weight="700" letter-spacing="4">PORTABLE CODEX WORKFLOWS</text>
    <text x="72" y="181" fill="#f8fafc" font-size="68" font-weight="800">Codex Powerpack</text>
    <text x="72" y="230" fill="#cbd5e1" font-size="30">Three bundles. One on-demand skill catalog.</text>
    <g transform="translate(72 286)">
      <rect width="196" height="82" rx="16" fill="#0f2c49" stroke="#2c5878"/>
      <text x="22" y="37" fill="#f8fafc" font-size="28" font-weight="800">3 bundles</text>
      <text x="22" y="63" fill="#94a3b8" font-size="19">ready to install</text>
    </g>
    <g transform="translate(286 286)">
      <rect width="240" height="82" rx="16" fill="#0f2c49" stroke="#2c5878"/>
      <text x="22" y="37" fill="#f8fafc" font-size="28" font-weight="800">38 repositories</text>
      <text x="22" y="63" fill="#94a3b8" font-size="19">configured snapshot</text>
    </g>
    <g transform="translate(544 286)">
      <rect width="232" height="82" rx="16" fill="#0f2c49" stroke="#2c5878"/>
      <text x="22" y="37" fill="#f8fafc" font-size="28" font-weight="800">1,921 rows</text>
      <text x="22" y="63" fill="#94a3b8" font-size="19">searchable catalog</text>
    </g>
    <g transform="translate(842 91)">
      <rect x="0" y="90" width="142" height="88" rx="18" fill="#0b253e" stroke="#5eead4" stroke-width="2"/>
      <text x="71" y="126" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">Router</text>
      <text x="71" y="153" text-anchor="middle" fill="#94a3b8" font-size="17">one match</text>
      <path d="M-72 134 H-10" fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round"/>
      <path d="M-20 122 L-4 134 L-20 146" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M152 134 H216" fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round"/>
      <circle cx="252" cy="54" r="15" fill="#fbbf24"/>
      <circle cx="292" cy="94" r="15" fill="#38bdf8"/>
      <circle cx="252" cy="134" r="15" fill="#5eead4"/>
      <circle cx="292" cy="174" r="15" fill="#a78bfa"/>
      <circle cx="252" cy="214" r="15" fill="#fb7185"/>
      <path d="M216 134 C232 134 236 54 252 54 M216 134 C248 134 260 94 292 94 M216 134 H252 M216 134 C248 134 260 174 292 174 M216 134 C232 134 236 214 252 214" fill="none" stroke="#7396b3" stroke-width="3" opacity="0.8"/>
      <text x="252" y="256" text-anchor="middle" fill="#cbd5e1" font-size="19">indexed skill sources</text>
    </g>
  </g>
</svg>
